services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: diting
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique POSTGRES_PASSWORD in .env}
      POSTGRES_DB: diting
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U diting -d diting']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  artex:
    image: ${DITING_IMAGE:-diting:2.7.0-local}
    build:
      context: .
      args:
        VERSION: 2.7.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_HOME: /var/lib/diting/runtime
      ARTEX_SKILL_DIR: /var/lib/diting/skills
      HOME: /var/lib/diting/home
      DITING_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:${DITING_PORT:-8787}:8787'
      - '127.0.0.1:${DITING_PROXY_PORT:-8788}:8788'
    volumes:
      - runtime:/var/lib/diting/runtime
      - workspace:/var/lib/diting/data
      - skills:/var/lib/diting/skills
      - toolhome:/var/lib/diting/home
    init: true
    stop_grace_period: 40s
    healthcheck:
      test: [CMD, python, /app/docker/healthcheck.py]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 6
    restart: unless-stopped
volumes:
  pgdata:
  runtime:
  workspace:
  skills:
  toolhome:
